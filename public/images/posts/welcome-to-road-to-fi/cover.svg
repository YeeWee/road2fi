<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5E6D3"/>
      <stop offset="100%" stop-color="#FFF8F0"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6C857"/>
      <stop offset="100%" stop-color="#E8A020"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#8B7355"/>
      <stop offset="100%" stop-color="#C4A87A"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#7BA06B"/>
      <stop offset="100%" stop-color="#A8C98E"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sky background -->
  <rect width="1200" height="675" fill="url(#sky)"/>

  <!-- Sun glow -->
  <circle cx="600" cy="200" r="120" fill="url(#sun)" opacity="0.3" filter="url(#glow)"/>
  <circle cx="600" cy="200" r="60" fill="url(#sun)" opacity="0.6"/>

  <!-- Hills -->
  <ellipse cx="300" cy="420" rx="400" ry="180" fill="#8FB573" opacity="0.4"/>
  <ellipse cx="900" cy="430" rx="450" ry="170" fill="#8FB573" opacity="0.35"/>

  <!-- Ground/grass area -->
  <rect y="400" width="1200" height="275" fill="url(#grass)" opacity="0.5"/>

  <!-- Winding road -->
  <path d="M600 675 Q580 580 520 500 Q460 420 500 350 Q540 280 580 240 Q600 220 600 200"
        stroke="url(#road)" stroke-width="60" fill="none" stroke-linecap="round" opacity="0.6"/>
  <!-- Road center line -->
  <path d="M600 675 Q580 580 520 500 Q460 420 500 350 Q540 280 580 240 Q600 220 600 200"
        stroke="#FFF8F0" stroke-width="3" fill="none" stroke-dasharray="12,10" opacity="0.5"/>

  <!-- Small trees left -->
  <g opacity="0.6">
    <rect x="180" y="420" width="8" height="50" fill="#6B4E2E" rx="2"/>
    <ellipse cx="184" cy="400" rx="25" ry="35" fill="#6B9346"/>
    <ellipse cx="184" cy="385" rx="20" ry="25" fill="#7BAE55"/>
  </g>
  <g opacity="0.5">
    <rect x="100" y="440" width="6" height="40" fill="#6B4E2E" rx="2"/>
    <ellipse cx="103" cy="425" rx="20" ry="28" fill="#6B9346"/>
  </g>

  <!-- Small trees right -->
  <g opacity="0.55">
    <rect x="1000" y="430" width="8" height="45" fill="#6B4E2E" rx="2"/>
    <ellipse cx="1004" cy="410" rx="22" ry="32" fill="#6B9346"/>
    <ellipse cx="1004" cy="395" rx="18" ry="22" fill="#7BAE55"/>
  </g>

  <!-- Stars/sparkles near sun -->
  <circle cx="500" cy="150" r="3" fill="#F6C857" opacity="0.7"/>
  <circle cx="680" cy="130" r="2.5" fill="#F6C857" opacity="0.6"/>
  <circle cx="550" cy="110" r="2" fill="#F6C857" opacity="0.5"/>
  <circle cx="700" cy="180" r="2" fill="#F6C857" opacity="0.4"/>
  <circle cx="480" cy="190" r="2.5" fill="#F6C857" opacity="0.5"/>

  <!-- Title text -->
  <text x="600" y="580" text-anchor="middle" font-family="Georgia, serif" font-size="48" fill="#5C4033" font-weight="bold" opacity="0.85">Road to Financial Independence</text>
  <text x="600" y="620" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#8B7355" opacity="0.7">Your journey starts with a single step</text>
</svg>
